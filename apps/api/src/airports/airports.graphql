type Airport {
    airportCode: String!
    airportName: String!
    city: String!
    coordinates: String
    timezone: String!
    country: String!
}

type AirportPage {
    data: [Airport!]!
    page: Int!
    size: Int!
    hasMore: Boolean!
}

type Query {
    airports(
        page: Int = 1
        size: Int = 20
        search: String
    ): AirportPage!
}
